name: Template CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run type-check
      - name: Lint
        run: pnpm run lint
      - name: Test contracts
        run: pnpm run test
      - name: Build production application
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm run build
      - name: Install Chromium for the built-app checks
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify template browser flows and capture responsive evidence
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm exec playwright test
      - name: Upload browser evidence
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-browser-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14

      - name: Package immutable delivery candidate
        run: pnpm run package:release
      - name: Upload delivery candidate and receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: creator-launch-os-delivery-${{ github.sha }}
          path: dist/releases/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  portfolio-export:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.0
      - name: Set up buyer runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install exporter dependencies
        run: pnpm install --frozen-lockfile
      - name: Export default buyer delivery
        id: buyer
        env:
          PORTFOLIO_EXPORT_ROOT: ${{ runner.temp }}/monograph-buyer
        run: node scripts/prepare-portfolio-check.mjs --buyer >> "$GITHUB_OUTPUT"
      - name: Archive source before installing dependencies
        env:
          BUYER_PROJECT: ${{ steps.buyer.outputs.directory }}
        run: |
          mkdir -p "$RUNNER_TEMP/monograph-delivery"
          tar -czf "$RUNNER_TEMP/monograph-delivery/monograph-source.tar.gz" -C "$BUYER_PROJECT" .
          cd "$RUNNER_TEMP/monograph-delivery"
          sha256sum monograph-source.tar.gz > SHA256SUMS
      - name: Upload buyer delivery candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monograph-source-${{ github.sha }}
          path: ${{ runner.temp }}/monograph-delivery/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Export adversarial buyer content
        id: portfolio
        env:
          PORTFOLIO_EXPORT_ROOT: ${{ runner.temp }}/portfolio-export
        run: node scripts/prepare-portfolio-check.mjs >> "$GITHUB_OUTPUT"
      - name: Install standalone dependencies from its own lockfile
        working-directory: ${{ steps.portfolio.outputs.directory }}
        run: pnpm install --frozen-lockfile
      - name: Verify standalone types, lint and production build
        working-directory: ${{ steps.portfolio.outputs.directory }}
        run: pnpm verify
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise standalone content, narrow layouts, keyboard and reduced motion
        env:
          PORTFOLIO_PROJECT: ${{ steps.portfolio.outputs.directory }}
        run: pnpm exec playwright test --config playwright.portfolio.config.mjs
