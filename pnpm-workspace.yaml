packages:
  - "."
  - "packages/*"

allowBuilds:
  unrs-resolver: false

# GHSA-rgj7-g3m4-5g8c: patched prebuilt libheif is included from sharp 0.35.4.
# Keep Next.js's transitive image processor on a reviewed patch release (0.35.5 also clears the sharp high advisory).
overrides:
  sharp: 0.35.5
  'brace-expansion@<2.0.0': 1.1.21
  'brace-expansion@>=3.0.0 <6.0.0': 5.0.12
  'source-map-js@<1.2.2': 1.2.2
  'zod@<4.6.6': 4.6.6
